name: CI/CD Pipeline

# Конвеєр перевіряє код на кожен пуш
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    # Задача build: встановлення залежностей через npm ci та запуск компіляції TypeScript
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm" # Кешування node_modules для пришвидшення конвеєра

            - name: Install dependencies
              run: npm ci

            - name: Build TypeScript
              run: npm run build

    # Задача test: встановлення залежностей та запуск Jest із збором покриття
    test:
        needs: build # Невдача на ранній стадії блокує наступні
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run tests with coverage
              run: npm run test -- --coverage

    # Задача deploy: автоматично розгортає застосунок на fly.io
    deploy:
        needs: test
        runs-on: ubuntu-latest
        # Обмеження виконання задачі гілкою main
        if: github.ref == 'refs/heads/main'
        env:
            FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Flyctl
              uses: superfly/flyctl-actions/setup-flyctl@master

            - name: Deploy to Fly.io
              # Делегує збірку на fly.io
              run: flyctl deploy --remote-only
